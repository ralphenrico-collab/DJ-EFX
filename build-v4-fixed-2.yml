name: Build DJ EFX V4 APK Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find V4 ZIP
        run: |
          test -f DJ_EFX_V4_Soundboard.zip
          echo "V4 ZIP found."

      - name: Extract V4 project
        run: |
          rm -rf project
          mkdir project
          unzip -q DJ_EFX_V4_Soundboard.zip -d project
          echo "Extracted files:"
          find project -maxdepth 5 -type f | head -150

      - name: Locate Android project
        id: locate
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          BUILD=$(find project -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)

          if [ -z "$BUILD" ]; then
            echo "No Gradle build file found."
            find project -maxdepth 8 -type f
            exit 1
          fi

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            PROJECT_DIR=$(dirname "$BUILD")
          fi

          echo "Android project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          gradle assembleDebug --stacktrace

      - name: Upload V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-EFX-V4-Soundboard-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
