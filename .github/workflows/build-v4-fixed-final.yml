name: Build DJ EFX V4 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find V4 ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname '*V4*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No V4 ZIP file was found."
            echo "ZIP files in repository:"
            find . -type f -iname '*.zip'
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract V4 project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          unzip -q "${{ steps.find_zip.outputs.zip }}" -d project

          echo "Extracted project files:"
          find project -maxdepth 5 -type f | head -200

      - name: Locate Android project
        id: android
        shell: bash
        run: |
          GRADLEW=$(find project -type f -name 'gradlew' | head -n 1)
          SETTINGS=$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
          elif [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            echo "ERROR: Android/Gradle project not found."
            find project -maxdepth 8 -type f
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.android.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-EFX-V4-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Build APK
        run: |
          PROJECT=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          DIR=$(dirname "$PROJECT")
          echo "Building from: $DIR"
          gradle -p "$DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-EFX-V4-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
