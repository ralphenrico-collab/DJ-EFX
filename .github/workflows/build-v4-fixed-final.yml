name: DJ EFX V4 FINAL APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Find V4 ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname '*V4*.zip' | head -1)
          echo "ZIP=$ZIP"
          test -n "$ZIP"

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname '*V4*.zip' | head -1)
          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          PROJECT=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          DIR=$(dirname "$PROJECT")
          echo "Building from: $DIR"
          gradle -p "$DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-EFX-V4-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
