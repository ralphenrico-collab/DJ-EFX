name: Build DJ EFX V4 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find V4 ZIP
        run: |
          ls -la
          find . -maxdepth 2 -type f

      - name: Extract V4 project
        run: |
          rm -rf project
          mkdir project
          unzip -q DJ_EFX_V4_Soundboard.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          gradle -p project assembleDebug

      - name: Upload V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-EFX-V4-Soundboard-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
